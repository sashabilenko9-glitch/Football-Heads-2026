name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs tests, the JaCoCo coverage gate, Checkstyle, PMD, SpotBugs and the
      # Spotless format check - see docs/adr/0005-quality-gate-tooling.md.
      - name: Run quality gates
        run: ./gradlew check --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: build/reports
          retention-days: 7
