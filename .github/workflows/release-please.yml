name: release-please

# Watches commits on main for Conventional Commits (see CONTRIBUTING.md) and
# keeps an open PR that bumps the version and drafts the next CHANGELOG.md
# section automatically. Merge that PR (instead of hand-editing CHANGELOG.md)
# to cut a release; it also creates and pushes the matching vX.Y.Z tag, which
# triggers release.yml.
#
# NOTE: added as scaffolding - review the first PR it opens carefully before
# merging, since it hasn't been exercised against a live commit history yet.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
