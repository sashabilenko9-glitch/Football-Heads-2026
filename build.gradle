plugins {
    id 'application'
    id 'eclipse'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.11'
    id 'com.diffplug.spotless' version '8.10.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.footballheads'
version = '1.0.0'

// The on-disk folder is football_heads.com, but the Gradle project name
// (settings.gradle) is football-heads-2026 (used for jar/release artifact
// names). Eclipse/Buildship requires a project living directly under the
// workspace root to keep the folder's name, so pin the Eclipse-visible
// project name separately rather than renaming either the folder or the
// Gradle project.
eclipse {
    project {
        name = 'football_heads.com'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.footballheads.Main'
}

// shadowJar (default output: build/libs/<name>-<version>-all.jar) bundles
// slf4j/logback in, so `java -jar ...-all.jar` runs standalone. Left at its
// default "-all" classifier rather than colliding with the plain jar's
// filename - Gradle's task-output validation flags that collision as
// incorrect against the application plugin's distZip/distTar/startScripts,
// which read the plain jar's output path.

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.18'
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.3'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}

// Coverage is scoped to the pure logic layer (entities/utils). Swing rendering
// code (ui/*, com.footballheads/*, all the paintComponent()/draw() methods) is
// intentionally excluded from the gate - see docs/adr/0006-coverage-scope.md.
def coverageClassDirs = {
    fileTree(layout.buildDirectory.dir('classes/java/main').get().asFile) {
        include 'entities/**', 'utils/**'
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(coverageClassDirs())
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(coverageClassDirs())
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

pmd {
    toolVersion = '7.27.0'
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
    consoleOutput = true
    ignoreFailures = false
}

spotbugs {
    toolVersion = '4.10.4'
    excludeFilter = file('config/spotbugs/exclude.xml')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.named('spotbugsMain') {
    reports.create('html') { required = true }
    reports.create('text') { required = true }
}

tasks.named('spotbugsTest') {
    enabled = false
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.36.1')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
